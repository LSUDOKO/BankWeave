# Render blueprint matching the live deployment: one free web service runs the API and the
# agent worker. FalkorDB is FalkorDB Cloud, KYC Postgres is Neon; secrets are set in Render
# (sync: false) and never committed.
services:
  - type: web
    name: bankweave-api
    runtime: docker
    region: singapore
    plan: free
    dockerfilePath: ./Dockerfile
    dockerContext: .
    healthCheckPath: /health
    envVars:
      - key: FALKORDB_HOST
        sync: false
      - key: FALKORDB_PORT
        sync: false
      - key: FALKORDB_USERNAME
        sync: false
      - key: FALKORDB_PASSWORD
        sync: false
      - key: FALKORDB_REGION
        value: ap-south-1
      - key: POSTGRES_URL
        sync: false
      - key: GROQ_API_KEY
        sync: false
      - key: OPENROUTER_API_KEY
        sync: false
      - key: CORS_ORIGINS
        value: "*"
      - key: RUN_WORKER
        value: "true"
      - key: PINNED_CASES
        value: C-44c08392
      # pruning old case graphs deletes data: switch on deliberately on the 100 MB tier
      - key: CAPACITY_PRUNE
        value: "false"
      # optional integrations; each has a keyless fallback
      - key: OPENSANCTIONS_API_KEY
        sync: false
      - key: HELIUS_API_KEY
        sync: false
      - key: OTEL_EXPORTER_OTLP_ENDPOINT
        sync: false
      - key: OTEL_EXPORTER_OTLP_HEADERS
        sync: false
      - key: DOSSIER_SIGNING_KEY
        sync: false
