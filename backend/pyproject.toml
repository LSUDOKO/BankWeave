[project]
name = "bankweave"
version = "0.1.0"
description = "Multi-agent cross-bank AML investigation on FalkorDB"
requires-python = ">=3.12,<3.13"
dependencies = [
  "falkordb>=1.0.10",
  "redis>=5.0",
  "fastapi>=0.115",
  "uvicorn[standard]>=0.30",
  "pydantic>=2.7",
  "pydantic-settings>=2.3",
  "pandas>=2.2",
  "numpy>=1.26",
  "networkx>=3.3",
  "pyyaml>=6.0",
  "psycopg[binary]>=3.2",
  "litellm>=1.50",
  "langgraph>=0.2",
  "mcp>=1.2",
  "httpx>=0.27",
]

[dependency-groups]
dev = ["pytest>=8.2", "pytest-asyncio>=0.23", "ruff>=0.5"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
line-length = 100
