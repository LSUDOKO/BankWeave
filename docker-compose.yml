services:
  falkordb:
    restart: unless-stopped
    image: falkordb/falkordb:latest
    ports: ["6390:6379", "3030:3000"]
    volumes: ["falkor_data:/var/lib/falkordb/data"]
  redis:
    restart: unless-stopped
    image: redis:7-alpine
    ports: ["6391:6379"]
  postgres:
    restart: unless-stopped
    image: postgres:16
    environment: { POSTGRES_PASSWORD: bankweave, POSTGRES_DB: kyc }
    ports: ["5440:5432"]
    volumes: ["pg_data:/var/lib/postgresql/data"]
  api:
    build: { context: ., dockerfile: backend/Dockerfile }
    profiles: ["full"]
    environment:
      FALKORDB_HOST: falkordb
      FALKORDB_PORT: "6379"
      REDIS_URL: redis://redis:6379/0
      POSTGRES_URL: postgresql://postgres:bankweave@postgres:5432/kyc
      OPENROUTER_API_KEY: ${OPENROUTER_API_KEY:-}
    ports: ["8000:8000"]
    depends_on: [falkordb, redis, postgres]
  mcp:
    build: { context: ., dockerfile: backend/Dockerfile }
    profiles: ["full"]
    command: python -m mcp_server.server --http 8765
    environment:
      FALKORDB_HOST: falkordb
      FALKORDB_PORT: "6379"
    ports: ["8765:8765"]
    depends_on: [falkordb]
  web:
    build: { context: ./frontend, args: { NEXT_PUBLIC_API_URL: "http://localhost:8000" } }
    profiles: ["full"]
    ports: ["3001:3000"]
    depends_on: [api]
volumes:
  falkor_data: {}
  pg_data: {}
